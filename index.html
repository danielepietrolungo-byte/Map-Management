<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Territori</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">

    <style>
        /* Stili per la tendina a scomparsa */
        #pannello-filtri { display: none; padding: 10px; background: #f9f9f9; border-bottom: 1px solid #ddd; }
        .toggle-btn { width: 100%; padding: 10px; background: #2c3e50; color: white; border: none; cursor: pointer; text-align: center; font-weight: bold; }
        
        /* Stili compatti */
        .status-btn { padding: 4px 8px !important; font-size: 11px !important; margin: 2px !important; }
        .filter-buttons { margin-bottom: 5px !important; padding-top: 5px !important; }
        .search-section { gap: 5px !important; margin-bottom: 5px !important; }
        #controls-section { position: sticky; top: 0; z-index: 1000; background: white; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }

        /* Banner di notifica WhatsApp per Mobile */
        #wa-banner {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #25D366;
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 2000;
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        #wa-banner button {
            background: white;
            color: #25D366;
            border: none;
            padding: 8px 15px;
            margin-top: 8px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>

<script>
    function toggleFiltri() {
        const panel = document.getElementById("pannello-filtri");
        const isOpening = panel.style.display !== "block";
        panel.style.display = isOpening ? "block" : "none";
        
        // Reset automatico quando si chiude la tendina
        if (!isOpening) {
            resettaTutto();
        }
    }

    function resettaTutto() {
        document.getElementById("searchInput").value = "";
        document.getElementById("selectTerritorio").selectedIndex = 0;
        filtraStato(null, 'tutti');
        cercaMappa();
    }

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('Service Worker registrato con successo!', reg))
                .catch(err => console.log('Errore registrazione Service Worker:', err));
        });
    }
</script>
</head>
<body>

    <div id="login-overlay" style="display: flex;">
        <div class="login-box">
            <h2>Accesso Riservato</h2>
            <p>Inserisci la password per consultare i territori:</p>
            <input type="password" id="passwordInput" placeholder="Password">
            <button onclick="controllaPassword()">Entra</button>
            <p id="errore" style="color: red; display: none;">Password errata o errore di connessione!</p>
        </div>
    </div>

    <header>
        <h1>Gestione Territori Roccamorice</h1>
        <div id="refresh-status" style="font-size: 10px; color: #aaa; margin-top: 5px;">Accesso richiesto</div>
    </header>

    <div id="controls-section" style="display: none;">
        <button class="toggle-btn" onclick="toggleFiltri()">⚙️ Filtri e Ricerca</button>
        <div id="pannello-filtri">
            <main class="container">
                <section class="search-section" style="display: flex; flex-wrap: wrap;">
                    <input type="text" id="searchInput" placeholder="Cerca un territorio..." oninput="cercaMappa()" onfocus="resetCampo()" style="flex: 1; min-width: 200px;">
                    <button onclick="cercaMappa()">Cerca</button>
                    <button onclick="caricaDatiDaSheet()" title="Aggiorna ora" style="background-color: #6c757d; color: white;">🔄</button>
                </section>

                <section class="filter-buttons">
                    <select id="selectTerritorio" onchange="filtraDaTendina(event)" style="width: 100%; padding: 4px; border-radius: 4px; border: 1px solid #ccc;">
                        <option value="">Tutti i territori</option>
                        <option value="Bolognano">Bolognano</option>
                        <option value="Musellaro">Musellaro</option>
                        <option value="Tocco">Tocco Da Casauria</option>
                        <option value="Piano">Piano D'Orta</option>
                        <option value="Roccamorice">Roccamorice</option>
                        <option value="San Valentino">San Valentino</option>
                        <option value="Abbateggio">Abbateggio</option>
                        <option value="Caramanico">Caramanico</option>
                        <option value="Eufemia">Sant'Eufemia</option>
                        <option value="Popoli">Popoli</option>
                        <option value="Vittorito">Vittorito</option>
                        <option value="Gagliano">Gagliano</option>
                        <option value="Secinaro">Secinaro</option>
                    </select>
                </section>

                <section class="filter-buttons" style="border-top: 1px solid #eee;">
                    <button onclick="filtraStato(event, 'tutti')" class="status-btn active">Tutti</button>
                    <button onclick="filtraStato(event, 'disponibile')" class="status-btn">Disponibili</button>
                    <button onclick="filtraStato(event, 'occupato')" class="status-btn">Assegnati</button>
                    <button onclick="filtraStato(event, 'ritardo')" class="status-btn" style="border: 1px solid #e74c3c; color: #e74c3c;">⚠️ Ritardo</button>
                </section>
            </main>
        </div>
    </div>

    <main class="container" style="margin-top: 20px;">
        <section id="map-results" class="results-grid"></section>
    </main>

    <!-- Banner per la notifica WhatsApp -->
    <div id="wa-banner">
        <div><strong>Salvato con successo!</strong></div>
        <button id="wa-btn" onclick="apriWhatsApp()">📲 Invia Notifica su WhatsApp</button>
        <div style="font-size: 11px; margin-top: 5px; cursor: pointer; text-decoration: underline;" onclick="chiudiBannerWA()">Chiudi</div>
    </div>

<script>
    const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbwd_hKE9r-x1i6KvEs5E5NeIAs9eYUnRJE5pGz6zVf73WX5xESubZw0-jQ7S8M8UNbekQ/exec";
    let databaseMappe = []; 
    let filtroStatoAttuale = 'tutti';
    let autoRefreshInterval;
    let urlWhatsAppCorrente = "";

    window.onload = function() {
        if (localStorage.getItem("accessoTerritori") === "ok" && localStorage.getItem("pwdTerritori")) {
            mostraContenuti();
            avviaApp();
        }
    };

    function mostraContenuti() {
        document.getElementById("login-overlay").style.display = "none";
        document.getElementById("controls-section").style.display = "block";
    }

    async function controllaPassword() {
        const inputPwd = document.getElementById("passwordInput").value;
        const erroreEl = document.getElementById("errore");
        try {
            erroreEl.style.display = "none";
            const response = await fetch(URL_SCRIPT, { method: "POST", body: JSON.stringify({ action: "login", password: inputPwd }) });
            const risultato = await response.json();
            if (risultato.success) {
                localStorage.setItem("accessoTerritori", "ok");
                localStorage.setItem("pwdTerritori", inputPwd);
                mostraContenuti();
                avviaApp();
            } else {
                erroreEl.innerText = "Password errata!";
                erroreEl.style.display = "block";
            }
        } catch (error) {
            erroreEl.innerText = "Errore di connessione.";
            erroreEl.style.display = "block";
        }
    }

    function avviaApp() {
        caricaDatiDaSheet();
        if (autoRefreshInterval) clearInterval(autoRefreshInterval);
        autoRefreshInterval = setInterval(caricaDatiDaSheet, 300000); 
    }

    async function caricaDatiDaSheet() {
        const statusEl = document.getElementById("refresh-status");
        try {
            const response = await fetch(URL_SCRIPT);
            databaseMappe = await response.json();
            cercaMappa(); 
            if(statusEl) statusEl.innerText = "Ultimo aggiornamento: " + new Date().toLocaleTimeString();
        } catch (error) {
            if(statusEl) statusEl.innerText = "Errore di connessione.";
        }
    }

    function filtraDaTendina(e) {
        document.getElementById("searchInput").value = e.target.value;
        cercaMappa();
    }

    function filtraStato(e, stato) {
        filtroStatoAttuale = stato;
        document.querySelectorAll('.status-btn').forEach(btn => btn.classList.remove('active'));
        if (e && e.currentTarget) e.currentTarget.classList.add('active');
        cercaMappa();
    }

    function resetCampo() { document.getElementById("searchInput").value = ""; }

    function formattaDataItaliana(stringaData) {
        if (!stringaData) return "";
        let dataPulita = stringaData.toString().trim().split(" ")[0].split("T")[0];
        if (dataPulita.includes("-")) {
            let p = dataPulita.split("-");
            return `${p[2]}/${p[1]}/${p[0]}`;
        }
        return dataPulita;
    }

    function cercaMappa() {
        const input = document.getElementById("searchInput").value.toLowerCase().trim();
        const contenitore = document.getElementById("map-results");
        contenitore.innerHTML = "";

        const risultati = databaseMappe.filter(m => {
            const matchTesto = m.nome ? m.nome.toLowerCase().includes(input) : false;
            const isLibero = ["sì", "si", "true"].includes((m.disponibile || "").toString().toLowerCase());
            const isRitardo = ["sì", "si", "true"].includes((m["in ritardo"] || m["inritardo"] || "").toString().toLowerCase());
            
            let matchStato = true;
            if (filtroStatoAttuale === 'disponibile') matchStato = isLibero;
            if (filtroStatoAttuale === 'occupato') matchStato = !isLibero;
            if (filtroStatoAttuale === 'ritardo') matchStato = isRitardo;
            return matchTesto && matchStato;
        });

        risultati.forEach(mappa => {
            let urlAnteprima = mappa.url;
            const match = mappa.url ? mappa.url.match(/\/d\/([^\/]+)/) : null;
            if (match) urlAnteprima = `https://lh3.googleusercontent.com/d/${match[1]}=w800`;

            const isLibero = ["sì", "si", "true"].includes((mappa.disponibile || "").toString().toLowerCase());
            
            const nomePulito = (mappa.nome || '').replace(/'/g, "\\'");

            const div = document.createElement("div");
            div.className = "card";
            div.innerHTML = `
                <div style="position: relative; overflow: hidden; cursor: pointer;" onclick="window.open('${mappa.url}', '_blank')">
                    <img src="${urlAnteprima}" style="width:100%; display:block;" onerror="this.src='https://via.placeholder.com/300x200?text=Territorio'">
                    <span style="position: absolute; top: 10px; right: 10px; background: ${isLibero ? "#2ecc71" : "#e74c3c"}; color: white; padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: bold;">
                        ${isLibero ? "Disponibile" : "Assegnato"}
                    </span>
                </div>
                <div class="card-body">
                    <h3>${mappa.nome || ''}</h3>
                    <p><strong>${isLibero ? "Restituito il:" : "Assegnato il:"}</strong> ${formattaDataItaliana(isLibero ? mappa["restituito il"] : mappa["assegnato il"])}</p>
                    <input type="text" id="input-assegnato-${mappa.riga}" value="${mappa.assegnato || ''}">
                    <button onclick="salvaAssegnazione(${mappa.riga}, '${nomePulito}')">Salva</button>
                </div>
            `;
            contenitore.appendChild(div);
        });
    }

    async function salvaAssegnazione(riga, nomeMappa) {
        const nuovoAssegnato = document.getElementById(`input-assegnato-${riga}`).value;
        const password = localStorage.getItem("pwdTerritori");

        try {
            const response = await fetch(URL_SCRIPT, { 
                method: "POST", 
                body: JSON.stringify({ 
                    action: "salva", 
                    password: password, 
                    riga: riga, 
                    assegnato: nuovoAssegnato 
                }) 
            });

            const res = await response.json();

            if (res.success) { 
                caricaDatiDaSheet();

                if (nuovoAssegnato.trim() !== "") {
                    const testo = `📌 *Territorio Assegnato*\n🗺️ *Territorio:* ${nomeMappa}\n👤 *Assegnato a:* ${nuovoAssegnato}`;
                    
                    // Rilevamento dispositivo mobile per lo schema WhatsApp corretto
                    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
                    if (isMobile) {
                        urlWhatsAppCorrente = `whatsapp://send?text=${encodeURIComponent(testo)}`;
                    } else {
                        urlWhatsAppCorrente = `https://web.whatsapp.com/send?text=${encodeURIComponent(testo)}`;
                    }

                    // Mostra il banner di condivisione
                    document.getElementById("wa-banner").style.display = "block";
                } else {
                    alert("Salvato con successo!");
                }
            } else { 
                alert("Errore durante il salvataggio."); 
            }
        } catch (error) {
            alert("Errore di connessione.");
        }
    }

    function apriWhatsApp() {
        if (urlWhatsAppCorrente) {
            window.location.href = urlWhatsAppCorrente;
            chiudiBannerWA();
        }
    }

    function chiudiBannerWA() {
        document.getElementById("wa-banner").style.display = "none";
    }
</script>
</body>
</html>
